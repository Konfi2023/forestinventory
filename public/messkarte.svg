<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 856 540" width="856" height="540">
  <!-- Credit card size: 85.6mm × 54mm at 10px/mm -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="856" y2="540" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
  </defs>

  <!-- Card background -->
  <rect width="856" height="540" rx="30" fill="url(#bg)" stroke="#e2e8f0" stroke-width="2"/>

  <!-- Magenta detection markers — centers are 760px = 76mm apart -->
  <!-- Left marker: center at x=48, y=270 (4.8mm from left edge, vertical center) -->
  <circle cx="48" cy="270" r="36" fill="#FF00FF" stroke="#CC00CC" stroke-width="2"/>
  <circle cx="48" cy="270" r="12" fill="white"/>

  <!-- Right marker: center at x=808, y=270 (4.8mm from right edge, vertical center) -->
  <circle cx="808" cy="270" r="36" fill="#FF00FF" stroke="#CC00CC" stroke-width="2"/>
  <circle cx="808" cy="270" r="12" fill="white"/>

  <!-- Center line between markers (subtle) -->
  <line x1="84" y1="270" x2="772" y2="270" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="8,6"/>

  <!-- Forest Manager logo area -->
  <g transform="translate(200, 100)">
    <!-- Leaf icon -->
    <path d="M23.5 43.5C20.4 43.1 17.6 42.3 15.2 41.1C12.7 39.9 10.7 38.4 8.9 36.5C7.2 34.5 5.9 32.3 5 29.8C4.1 27.2 3.6 24.4 3.6 21.3C7.2 21.7 10.3 22.3 12.8 23.2C15.3 24.2 17.3 25.5 18.9 27.2C20.5 29 21.6 31.2 22.3 33.8C23.1 36.5 23.4 39.7 23.5 43.5ZM23.5 26C22.7 24.8 21.7 23.6 20.3 22.5C18.9 21.4 17.4 20.5 15.7 19.6C15.9 18.3 16.2 16.9 16.7 15.4C17.2 14 17.7 12.5 18.4 11.1C19.1 9.6 19.9 8.3 20.7 6.9C21.6 5.6 22.5 4.3 23.5 3.2C24.5 4.3 25.4 5.6 26.3 6.9C27.1 8.3 27.9 9.7 28.6 11.1C29.3 12.5 29.8 14 30.3 15.4C30.8 16.9 31.1 18.3 31.3 19.6C29.6 20.4 28.1 21.4 26.7 22.5C25.4 23.6 24.3 24.7 23.5 26ZM27.9 42.6C27.8 40.1 27.6 37.8 27.3 35.8C27 33.8 26.5 32 25.9 30.3C27.5 27.6 29.7 25.4 32.5 23.8C35.3 22.2 38.9 21.4 43.4 21.3C43.4 26.6 42 31 39.2 34.8C36.5 38.5 32.7 41.1 27.9 42.6Z" fill="#16a34a" transform="scale(1.4)"/>
  </g>
  <text x="240" y="155" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="42" fill="#1e293b" letter-spacing="-0.5">Forest</text>
  <text x="395" y="155" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="42" fill="#16a34a" letter-spacing="-0.5">Manager</text>

  <!-- "Messkarte" label -->
  <text x="428" y="210" font-family="system-ui, -apple-system, sans-serif" font-weight="500" font-size="28" fill="#94a3b8" text-anchor="middle" letter-spacing="3">MESSKARTE</text>

  <!-- Scale ruler at bottom -->
  <g transform="translate(128, 440)">
    <!-- 10cm ruler (100mm = 600px at this scale, but we only have ~700px width) -->
    <line x1="0" y1="0" x2="600" y2="0" stroke="#334155" stroke-width="2"/>
    <!-- cm ticks -->
    <line x1="0" y1="-12" x2="0" y2="4" stroke="#334155" stroke-width="2"/>
    <line x1="60" y1="-8" x2="60" y2="4" stroke="#334155" stroke-width="1.5"/>
    <line x1="120" y1="-12" x2="120" y2="4" stroke="#334155" stroke-width="2"/>
    <line x1="180" y1="-8" x2="180" y2="4" stroke="#334155" stroke-width="1.5"/>
    <line x1="240" y1="-12" x2="240" y2="4" stroke="#334155" stroke-width="2"/>
    <line x1="300" y1="-8" x2="300" y2="4" stroke="#334155" stroke-width="1.5"/>
    <line x1="360" y1="-12" x2="360" y2="4" stroke="#334155" stroke-width="2"/>
    <line x1="420" y1="-8" x2="420" y2="4" stroke="#334155" stroke-width="1.5"/>
    <line x1="480" y1="-12" x2="480" y2="4" stroke="#334155" stroke-width="2"/>
    <line x1="540" y1="-8" x2="540" y2="4" stroke="#334155" stroke-width="1.5"/>
    <line x1="600" y1="-12" x2="600" y2="4" stroke="#334155" stroke-width="2"/>
    <!-- labels -->
    <text x="0" y="24" font-family="system-ui, sans-serif" font-size="16" fill="#64748b" text-anchor="middle">0</text>
    <text x="120" y="24" font-family="system-ui, sans-serif" font-size="16" fill="#64748b" text-anchor="middle">2</text>
    <text x="240" y="24" font-family="system-ui, sans-serif" font-size="16" fill="#64748b" text-anchor="middle">4</text>
    <text x="360" y="24" font-family="system-ui, sans-serif" font-size="16" fill="#64748b" text-anchor="middle">6</text>
    <text x="480" y="24" font-family="system-ui, sans-serif" font-size="16" fill="#64748b" text-anchor="middle">8</text>
    <text x="600" y="24" font-family="system-ui, sans-serif" font-size="16" fill="#64748b" text-anchor="middle">cm</text>
  </g>

  <!-- Website -->
  <text x="428" y="510" font-family="system-ui, -apple-system, sans-serif" font-size="18" fill="#cbd5e1" text-anchor="middle">forest-manager.eu</text>

  <!-- Marker distance label (76mm between centers) -->
  <text x="428" y="310" font-family="system-ui, sans-serif" font-size="14" fill="#cbd5e1" text-anchor="middle">76,0 mm</text>
</svg>
