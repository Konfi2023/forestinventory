<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 856 540" width="856" height="540">
  <!-- Credit card: 85.6mm × 54mm at 10px/mm -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="856" y2="540" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
  </defs>

  <!-- Card background -->
  <rect width="856" height="540" rx="30" fill="url(#bg)" stroke="#e2e8f0" stroke-width="2"/>

  <!-- Magenta detection markers — centers 760px = 76mm apart -->
  <circle cx="48" cy="270" r="36" fill="#FF00FF" stroke="#CC00CC" stroke-width="2"/>
  <circle cx="48" cy="270" r="12" fill="white"/>
  <circle cx="808" cy="270" r="36" fill="#FF00FF" stroke="#CC00CC" stroke-width="2"/>
  <circle cx="808" cy="270" r="12" fill="white"/>

  <!-- Center line between markers -->
  <line x1="84" y1="270" x2="772" y2="270" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="8,6"/>

  <!-- Forest Manager logo + text — centered as one unit -->
  <g transform="translate(328, 80)">
    <!-- Leaf icon (scaled and positioned next to text) -->
    <path d="M23.5 43.5C20.4 43.1 17.6 42.3 15.2 41.1C12.7 39.9 10.7 38.4 8.9 36.5C7.2 34.5 5.9 32.3 5 29.8C4.1 27.2 3.6 24.4 3.6 21.3C7.2 21.7 10.3 22.3 12.8 23.2C15.3 24.2 17.3 25.5 18.9 27.2C20.5 29 21.6 31.2 22.3 33.8C23.1 36.5 23.4 39.7 23.5 43.5ZM23.5 26C22.7 24.8 21.7 23.6 20.3 22.5C18.9 21.4 17.4 20.5 15.7 19.6C15.9 18.3 16.2 16.9 16.7 15.4C17.2 14 17.7 12.5 18.4 11.1C19.1 9.6 19.9 8.3 20.7 6.9C21.6 5.6 22.5 4.3 23.5 3.2C24.5 4.3 25.4 5.6 26.3 6.9C27.1 8.3 27.9 9.7 28.6 11.1C29.3 12.5 29.8 14 30.3 15.4C30.8 16.9 31.1 18.3 31.3 19.6C29.6 20.4 28.1 21.4 26.7 22.5C25.4 23.6 24.3 24.7 23.5 26ZM27.9 42.6C27.8 40.1 27.6 37.8 27.3 35.8C27 33.8 26.5 32 25.9 30.3C27.5 27.6 29.7 25.4 32.5 23.8C35.3 22.2 38.9 21.4 43.4 21.3C43.4 26.6 42 31 39.2 34.8C36.5 38.5 32.7 41.1 27.9 42.6Z" fill="#16a34a" transform="translate(-24,-3) scale(1.2)"/>
  </g>
  <text x="428" y="140" font-family="system-ui, -apple-system, sans-serif" font-size="42" fill="#1e293b" text-anchor="middle" letter-spacing="-0.5">
    <tspan font-weight="600">Forest </tspan><tspan font-weight="600" fill="#16a34a">Manager</tspan>
  </text>

  <!-- "MESSKARTE" label -->
  <text x="428" y="180" font-family="system-ui, -apple-system, sans-serif" font-weight="500" font-size="24" fill="#94a3b8" text-anchor="middle" letter-spacing="4">MESSKARTE</text>

  <!-- Scale ruler at bottom — 7cm fits within card width (700px) -->
  <g transform="translate(128, 440)">
    <line x1="0" y1="0" x2="600" y2="0" stroke="#334155" stroke-width="2"/>
    <!-- Major ticks (every cm = 60px... wait, 10px/mm = 100px/cm) -->
    <!-- Actually at 10px/mm the card is 856px = 85.6mm. So 1cm = 100px. -->
    <!-- But 600px = 6cm. Let's show 0-6cm ruler. -->
  </g>
  <!-- Redo ruler correctly: 1cm = 100px at this scale. Ruler from x=128 to x=728 = 600px = 6cm -->
  <g transform="translate(128, 440)">
    <line x1="0" y1="0" x2="600" y2="0" stroke="#334155" stroke-width="2"/>
    <!-- cm ticks (every 100px = 1cm) -->
    <line x1="0" y1="-14" x2="0" y2="4" stroke="#334155" stroke-width="2"/>
    <line x1="50" y1="-8" x2="50" y2="4" stroke="#334155" stroke-width="1"/>
    <line x1="100" y1="-14" x2="100" y2="4" stroke="#334155" stroke-width="2"/>
    <line x1="150" y1="-8" x2="150" y2="4" stroke="#334155" stroke-width="1"/>
    <line x1="200" y1="-14" x2="200" y2="4" stroke="#334155" stroke-width="2"/>
    <line x1="250" y1="-8" x2="250" y2="4" stroke="#334155" stroke-width="1"/>
    <line x1="300" y1="-14" x2="300" y2="4" stroke="#334155" stroke-width="2"/>
    <line x1="350" y1="-8" x2="350" y2="4" stroke="#334155" stroke-width="1"/>
    <line x1="400" y1="-14" x2="400" y2="4" stroke="#334155" stroke-width="2"/>
    <line x1="450" y1="-8" x2="450" y2="4" stroke="#334155" stroke-width="1"/>
    <line x1="500" y1="-14" x2="500" y2="4" stroke="#334155" stroke-width="2"/>
    <line x1="550" y1="-8" x2="550" y2="4" stroke="#334155" stroke-width="1"/>
    <line x1="600" y1="-14" x2="600" y2="4" stroke="#334155" stroke-width="2"/>
    <!-- Labels -->
    <text x="0" y="24" font-family="system-ui, sans-serif" font-size="16" fill="#64748b" text-anchor="middle">0</text>
    <text x="100" y="24" font-family="system-ui, sans-serif" font-size="16" fill="#64748b" text-anchor="middle">1</text>
    <text x="200" y="24" font-family="system-ui, sans-serif" font-size="16" fill="#64748b" text-anchor="middle">2</text>
    <text x="300" y="24" font-family="system-ui, sans-serif" font-size="16" fill="#64748b" text-anchor="middle">3</text>
    <text x="400" y="24" font-family="system-ui, sans-serif" font-size="16" fill="#64748b" text-anchor="middle">4</text>
    <text x="500" y="24" font-family="system-ui, sans-serif" font-size="16" fill="#64748b" text-anchor="middle">5</text>
    <text x="600" y="24" font-family="system-ui, sans-serif" font-size="16" fill="#64748b" text-anchor="middle">6 cm</text>
  </g>

  <!-- Website -->
  <text x="428" y="510" font-family="system-ui, -apple-system, sans-serif" font-size="18" fill="#cbd5e1" text-anchor="middle">forest-manager.eu</text>

  <!-- Marker distance label -->
  <text x="428" y="310" font-family="system-ui, sans-serif" font-size="13" fill="#d4d4d8" text-anchor="middle">76,0 mm</text>
</svg>
